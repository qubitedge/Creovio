<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CreoVio AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'aqua-dark': '#144f4f',
                        'aqua-base': '#2D6A6D',
                        'aqua-light': '#7ecfcf',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-teal: #7ecfcf;
            --dark-teal: #144f4f;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body {
            background: var(--bg-teal);
            color: var(--dark-teal);
            min-height: 100vh;
        }

        .dot-grid {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(20, 79, 79, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: -1;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .input-glass {
            background: rgba(20, 79, 79, 0.05);
            border: 1px solid rgba(20, 79, 79, 0.1);
            transition: all 0.2s;
        }

        .input-glass:focus {
            background: white;
            border-color: var(--dark-teal);
            outline: none;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">
    <div class="dot-grid"></div>

    <main class="w-full max-w-4xl space-y-8 py-12">
        
        <!-- Navbar (Simplified) -->
        <nav class="flex items-center justify-between mb-4 px-4">
            <a href="dashboard.html" class="flex items-center gap-2 group">
                <div class="w-10 h-10 bg-aqua-dark rounded-xl flex items-center justify-center group-hover:scale-105 transition-transform">
                    <i data-lucide="sparkles" class="text-white w-5 h-5"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight">Creo<span class="opacity-50">Vio</span></span>
            </a>
            <div class="flex items-center gap-6">
                <a href="dashboard.html" class="text-sm font-bold opacity-60 hover:opacity-100 transition-opacity">Dashboard</a>
                <a href="projects.html" class="text-sm font-bold opacity-60 hover:opacity-100 transition-opacity">Library</a>
            </div>
        </nav>

        <!-- Personal Information Master Grid -->
        <div class="glass rounded-[3rem] overflow-hidden p-8 md:p-12 shadow-2xl border border-white/40">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <!-- Left: Profile Identity -->
                <div class="lg:col-span-4 flex flex-col items-center text-center space-y-6">
                    <div class="relative group">
                        <div class="w-48 h-48 rounded-[3rem] bg-aqua-dark overflow-hidden relative border-4 border-white shadow-2xl">
                            <span id="profileInitials" class="absolute inset-0 flex items-center justify-center text-6xl font-black text-white">P</span>
                            <img id="profilePreview" src="" class="absolute inset-0 w-full h-full object-cover hidden">
                        </div>
                        <button onclick="document.getElementById('avatarInput').click()" class="absolute -bottom-2 -right-2 w-12 h-12 bg-aqua-dark text-white rounded-2xl flex items-center justify-center shadow-xl hover:scale-110 transition-transform">
                            <i data-lucide="camera" class="w-6 h-6"></i>
                        </button>
                        <input type="file" id="avatarInput" class="hidden" accept="image/*">
                    </div>

                    <div class="space-y-2">
                        <h1 class="text-3xl font-black tracking-tight" id="profileNameDisplay">pravallika</h1>
                        <p id="profileHandleDisplay" class="text-aqua-dark/40 font-bold text-sm tracking-widest uppercase">@pravallika_creates</p>
                    </div>

                    <div id="joinDateDisplay" class="px-6 py-2 bg-white/30 rounded-full text-[10px] font-black uppercase tracking-widest border border-white/40">
                        Joined May 2024
                    </div>

                    <div class="pt-6 w-full space-y-3">
                        <div class="flex items-center justify-between p-4 rounded-2xl bg-white/20 border border-white/20">
                            <span class="text-[10px] font-black uppercase opacity-40">Status</span>
                            <span class="text-xs font-black text-green-600 flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-green-600 animate-pulse"></span> Verified Creator
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Right: Information Form -->
                <div class="lg:col-span-8 space-y-8">
                    <div class="flex items-center gap-3">
                        <i data-lucide="user-cog" class="w-6 h-6 text-aqua-dark"></i>
                        <h2 class="text-2xl font-black tracking-tight">Personal Information</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase opacity-40 tracking-widest ml-1">Full Name</label>
                            <input type="text" id="inputName" class="w-full px-6 py-4 rounded-2xl input-glass font-bold text-sm" placeholder="pravallika">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase opacity-40 tracking-widest ml-1">Username Handle</label>
                            <input type="text" id="inputHandle" class="w-full px-6 py-4 rounded-2xl input-glass font-bold text-sm" placeholder="@pravallika_creates">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase opacity-40 tracking-widest ml-1">Email Address</label>
                            <input type="email" id="inputEmail" class="w-full px-6 py-4 rounded-2xl input-glass font-bold text-sm" placeholder="pravi@example.com">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase opacity-40 tracking-widest ml-1">Location</label>
                            <input type="text" id="inputLocation" class="w-full px-6 py-4 rounded-2xl input-glass font-bold text-sm" placeholder="Mumbai, India">
                        </div>
                        <div class="col-span-1 md:col-span-2 space-y-2">
                            <label class="text-[10px] font-black uppercase opacity-40 tracking-widest ml-1">Professional Bio</label>
                            <textarea id="inputBio" rows="4" class="w-full px-6 py-4 rounded-2xl input-glass font-bold text-sm leading-relaxed" placeholder="Tell the world about your creative vision..."></textarea>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pt-4">
                        <button id="saveBtn" class="flex-1 bg-aqua-dark text-white px-8 py-5 rounded-[2rem] font-black text-md shadow-2xl shadow-aqua-dark/30 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                            <i data-lucide="save" class="w-5 h-5"></i> Update Profile Information
                        </button>
                        <button onclick="location.reload()" class="px-8 py-5 rounded-[2rem] font-bold text-sm opacity-60 hover:opacity-100 hover:bg-white/20 transition-all">
                            Cancel
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script src="creovio.js"></script>
    <script>
        // Emergency Quota Cleanup
        const saved = localStorage.getItem('creovio_state');
        if (saved && saved.length > 2000000) { // If over 2MB, it's likely a stuck Base64 image
            console.warn("Legacy state too large, cleaning up to free quota...");
            const state = JSON.parse(saved);
            if (state.user && state.user.avatar && state.user.avatar.startsWith('data:')) {
                state.user.avatar = ''; // Clear the massive string
                localStorage.setItem('creovio_state', JSON.stringify(state));
                console.log("Cleaned up Base64 avatar from localStorage");
            }
        }

        console.log("Profile page script loaded");
        lucide.createIcons();

        // Load state
        window.addEventListener('DOMContentLoaded', () => {
            console.log("DOM Loaded, initializing state...");
            if (typeof CreoVio === 'undefined') {
                console.error("CreoVio is not defined! Check creovio.js path.");
                return;
            }
            
            const user = CreoVio.state.user;
            if (user) {
                console.log("User state found:", user);
                document.getElementById('inputName').value = user.name || '';
                document.getElementById('inputHandle').value = user.handle || '';
                document.getElementById('inputEmail').value = user.email || '';
                document.getElementById('inputLocation').value = user.location || '';
                document.getElementById('inputBio').value = user.bio || '';
                
                document.getElementById('profileNameDisplay').innerText = user.name || 'pravallika';
                document.getElementById('profileHandleDisplay').innerText = user.handle || '@pravallika_creates';
                
                if (user.joinDate) {
                    document.getElementById('joinDateDisplay').innerText = "Joined " + user.joinDate;
                }

                if (user.avatar) {
                    const preview = document.getElementById('profilePreview');
                    preview.src = user.avatar;
                    preview.classList.remove('hidden');
                    document.getElementById('profileInitials').classList.add('hidden');
                }
            }
        });

        // Handle avatar upload with server-side persistence (fixes quota issues)
        document.getElementById('avatarInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                console.log("Uploading avatar to server...");
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const res = await fetch('https://peoples-but-runtime-kept.trycloudflare.com/upload-avatar', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    
                    if (data.avatar_url) {
                        const preview = document.getElementById('profilePreview');
                        preview.src = data.avatar_url;
                        preview.classList.remove('hidden');
                        document.getElementById('profileInitials').classList.add('hidden');
                        
                        // Auto-update state for avatar
                        const user = CreoVio.state.user;
                        CreoVio.updateState({ user: { ...user, avatar: data.avatar_url } });
                        console.log("Avatar saved to server:", data.avatar_url);
                    }
                } catch (err) {
                    console.error("Avatar upload failed:", err);
                    alert("Failed to upload avatar. Check connection.");
                }
            }
        });

        // Save Logic
        document.getElementById('saveBtn').addEventListener('click', () => {
            console.log("Save button clicked");
            try {
                const name = document.getElementById('inputName').value;
                const handle = document.getElementById('inputHandle').value;
                const email = document.getElementById('inputEmail').value;
                const location = document.getElementById('inputLocation').value;
                const bio = document.getElementById('inputBio').value;
                const avatar = document.getElementById('profilePreview').src;

                const updates = {
                    user: { 
                        ...CreoVio.state.user, 
                        name, 
                        handle, 
                        email, 
                        location, 
                        bio, 
                        avatar: avatar.includes('avatar_') ? avatar : (CreoVio.state.user.avatar || '')
                    }
                };

                console.log("Applying updates:", updates);
                CreoVio.updateState(updates);

                // Update UI display immediately
                document.getElementById('profileNameDisplay').innerText = name;
                document.getElementById('profileHandleDisplay').innerText = handle;
                const btn = document.getElementById('saveBtn');
                const original = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> Profile Updated Successfully!';
                btn.style.backgroundColor = '#16a34a'; // green-600
                lucide.createIcons();

                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.style.backgroundColor = '';
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error("Save failed:", err);
                alert("Failed to save profile. See console for details.");
            }
        });
    </script>
</body>
</html>
