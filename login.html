<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreoVio - Login</title>
    
    <!-- Professional Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#0B0F19',
                        indigo: {
                            glow: '#6366F1',
                            deep: '#4F46E5',
                        },
                        card: 'rgba(255, 255, 255, 0.03)',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        kanit: ['Kanit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #8ED3D6;
            color: #1D4D4F;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-midnight p-6">

    <div class="w-full max-w-md glass p-10 rounded-3xl space-y-8 shadow-2xl">
        
        <div class="text-center space-y-2">
            <div class="flex items-center justify-center gap-2">
                <div class="w-10 h-10 bg-indigo-glow rounded-xl flex items-center justify-center shadow-lg shadow-indigo-glow/20">
                    <i data-lucide="cpu" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-3xl font-kanit font-extrabold tracking-tight">Creo<span class="text-indigo-glow">Vio</span></span>
            </div>
            <h1 class="text-2xl font-bold mt-6">Welcome Back</h1>
            <p class="text-gray-500 text-sm">Sign in to continue your creative journey.</p>
        </div>

        <form class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="email" required class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-indigo-glow transition-colors" placeholder="name@example.com">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="password" required class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-indigo-glow transition-colors" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between px-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-white/10 bg-white/5 accent-indigo-glow">
                    <span class="text-xs text-gray-500">Remember Me</span>
                </label>
                <a href="#" class="text-xs text-indigo-glow hover:underline font-bold">Forgot Password?</a>
            </div>

            <a href="dashboard.html" class="w-full bg-indigo-glow hover:bg-indigo-deep text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-glow/20 transition-all flex items-center justify-center gap-2">
                Sign In
            </a>
        </form>

        <div class="text-center pt-4">
            <p class="text-sm text-gray-500">
                Don't have an account? 
                <a href="signup.html" class="text-indigo-glow hover:underline font-bold">Sign Up</a>
            </p>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
